<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能任务管理系统</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1f2733;--muted:#7b8698;--line:#e6eaf0;
  --accent:#1479c9;--accent-soft:#e8f2fb;
  --high:#d9483b;--high-bg:#fdecea;--medium:#c97a09;--medium-bg:#fdf3e1;--low:#17836a;--low-bg:#e6f5f0;
  --shadow:0 1px 2px rgba(20,34,52,.06),0 8px 24px rgba(20,34,52,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.page{max-width:820px;margin:0 auto;padding:40px 20px 64px}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.subtitle{color:var(--muted);font-size:14px;margin-top:6px}
.driver{flex-shrink:0;font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid #cfe3f6;border-radius:999px;padding:4px 12px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.add-card{padding:18px}
.add-form{display:flex;gap:10px}
.title-input{flex:1;min-width:0;height:44px;padding:0 14px;font-size:15px;color:var(--text);background:#fbfcfe;border:1px solid var(--line);border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s}
.title-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(20,121,201,.12);background:#fff}
.priority-select{height:44px;padding:0 10px;font-size:14px;color:var(--text);background:#fbfcfe;border:1px solid var(--line);border-radius:10px;outline:none;cursor:pointer}
.btn-primary{height:44px;padding:0 22px;font-size:15px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#0f6bab}
.btn-primary:disabled{background:#a9c4da;cursor:not-allowed}
.form-tip{min-height:18px;margin-top:8px;font-size:13px;color:var(--high)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 12px;flex-wrap:wrap}
.filters{display:flex;gap:6px}
.filter{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;font-size:14px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:9px;cursor:pointer;transition:all .15s}
.filter:hover{color:var(--text);background:#fff;border-color:var(--line)}
.filter.active{color:var(--accent);background:#fff;border-color:#cfe3f6;font-weight:600}
.filter i{font-style:normal;font-size:12px;color:var(--muted);background:#f0f3f7;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.filter.active i{color:var(--accent);background:var(--accent-soft)}
.summary{font-size:13px;color:var(--muted)}
.list-card{overflow:hidden}
.task-list{list-style:none}
.task{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .15s}
.task:last-child{border-bottom:none}
.task:hover{background:#fafcfe}
.toggle{flex-shrink:0;width:22px;height:22px;display:grid;place-items:center;font-size:13px;color:transparent;background:#fff;border:1.5px solid #c7d0dc;border-radius:50%;cursor:pointer;transition:all .15s}
.toggle:hover{border-color:var(--accent);background:var(--accent-soft)}
.toggle.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.task-main{flex:1;min-width:0}
.task-title{font-size:15px;word-break:break-word}
.task.completed .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px}
.badge.high{color:var(--high);background:var(--high-bg)}
.badge.medium{color:var(--medium);background:var(--medium-bg)}
.badge.low{color:var(--low);background:var(--low-bg)}
.btn-delete{flex-shrink:0;height:30px;padding:0 12px;font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .15s}
.btn-delete:hover{color:var(--high);border-color:#f0c3bd;background:var(--high-bg)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty-icon{width:44px;height:44px;margin:0 auto 12px;display:grid;place-items:center;font-size:20px;color:var(--accent);background:var(--accent-soft);border-radius:50%}
.empty p{font-size:14px}
.footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .page{padding:24px 14px 48px}h1{font-size:21px}.header{flex-direction:column}
  .add-form{flex-wrap:wrap}.title-input{flex:1 1 100%}.priority-select{flex:1}.btn-primary{flex:1}
  .task{padding:13px 14px}
}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div>
      <h1>智能任务管理系统</h1>
      <p class="subtitle">按优先级安排待办，专注当下最重要的事</p>
    </div>
    <div class="driver" id="driver">数据源：Supabase</div>
  </header>

  <section class="card add-card">
    <form id="add-form" class="add-form" autocomplete="off">
      <input id="title-input" class="title-input" type="text" maxlength="120"
             placeholder="要做什么？例如：完成软件测试用例评审" required />
      <select id="priority-select" class="priority-select" aria-label="优先级">
        <option value="高">高优先级</option>
        <option value="中" selected>中优先级</option>
        <option value="低">低优先级</option>
      </select>
      <button type="submit" class="btn-primary">添加任务</button>
    </form>
    <p class="form-tip" id="form-tip"></p>
  </section>

  <section class="toolbar">
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">全部<i id="count-all">0</i></button>
      <button class="filter" data-filter="高">高<i id="count-高">0</i></button>
      <button class="filter" data-filter="中">中<i id="count-中">0</i></button>
      <button class="filter" data-filter="低">低<i id="count-低">0</i></button>
    </div>
    <span class="summary" id="summary"></span>
  </section>

  <section class="card list-card">
    <ul class="task-list" id="task-list"></ul>
    <div class="empty" id="empty" hidden>
      <div class="empty-icon">✓</div>
      <p>这里还没有任务，先添加一条吧</p>
    </div>
  </section>

  <footer class="footer">单文件版 · 浏览器直连 Supabase REST API</footer>
</div>

<script>
/* ===== 配置：换成你自己的项目即可 ===== */
const SUPABASE_URL = 'https://nbreynluvtcxijqpzcnt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RbVFOD3X2ZPWxQnfbcD1KA_dbTDxe7X';
/* ===================================== */

const TABLE = `${SUPABASE_URL}/rest/v1/tasks`;
const PRIORITY_CLASS = { 高: 'high', 中: 'medium', 低: 'low' };

const state = { tasks: [], filter: 'all' };

const el = {
  form: document.getElementById('add-form'),
  title: document.getElementById('title-input'),
  priority: document.getElementById('priority-select'),
  tip: document.getElementById('form-tip'),
  list: document.getElementById('task-list'),
  empty: document.getElementById('empty'),
  filters: document.getElementById('filters'),
  summary: document.getElementById('summary'),
};

/* ---------- 工具 ---------- */
const headers = (extra = {}) => ({
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json',
  ...extra,
});

async function request(url, options = {}) {
  const res = await fetch(url, options);
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!res.ok) {
    const msg = (body && (body.message || body.error_description || body.hint)) || `请求失败（${res.status}）`;
    throw new Error(msg);
  }
  return body;
}

function formatTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
  const yesterday = new Date(now.getTime() - 86400000);
  if (d.toDateString() === yesterday.toDateString()) return `昨天 ${hm}`;
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
}

const showTip = (msg) => { el.tip.textContent = msg; };

/* ---------- 渲染 ---------- */
function render() {
  el.list.innerHTML = '';
  el.empty.hidden = state.tasks.length > 0;
  const done = state.tasks.filter((t) => t.completed).length;
  el.summary.textContent = state.tasks.length ? `共 ${state.tasks.length} 条 · 已完成 ${done} 条` : '';

  for (const task of state.tasks) {
    const li = document.createElement('li');
    li.className = `task${task.completed ? ' completed' : ''}`;

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = `toggle${task.completed ? ' done' : ''}`;
    toggle.textContent = '✓';
    toggle.title = task.completed ? '点击标记为未完成' : '点击标记为已完成';
    toggle.setAttribute('aria-label', toggle.title);
    toggle.addEventListener('click', () => toggleTask(task));

    const main = document.createElement('div');
    main.className = 'task-main';

    const title = document.createElement('div');
    title.className = 'task-title';
    title.textContent = task.title;

    const meta = document.createElement('div');
    meta.className = 'task-meta';

    const badge = document.createElement('span');
    badge.className = `badge ${PRIORITY_CLASS[task.priority] || 'medium'}`;
    badge.textContent = `${task.priority}优先级`;

    const status = document.createElement('span');
    status.textContent = task.completed ? '已完成' : '未完成';

    const time = document.createElement('span');
    time.textContent = formatTime(task.created_at);

    meta.append(badge, status, time);
    main.append(title, meta);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-delete';
    del.textContent = '删除';
    del.addEventListener('click', () => deleteTask(task));

    li.append(toggle, main, del);
    el.list.append(li);
  }
}

function updateCounts(allTasks) {
  const counts = { all: allTasks.length, 高: 0, 中: 0, 低: 0 };
  allTasks.forEach((t) => { counts[t.priority] = (counts[t.priority] || 0) + 1; });
  Object.entries(counts).forEach(([k, v]) => {
    const node = document.getElementById(`count-${k}`);
    if (node) node.textContent = v;
  });
}

/* ---------- 数据操作 ---------- */
async function loadTasks() {
  const filter = state.filter === 'all' ? '' : `&priority=eq.${encodeURIComponent(state.filter)}`;
  const list = await request(
    `${TABLE}?select=id,title,priority,completed,created_at&order=created_at.desc${filter}`,
    { headers: headers() }
  );
  state.tasks = list || [];

  const all = state.filter === 'all'
    ? state.tasks
    : (await request(`${TABLE}?select=id,title,priority,completed,created_at&order=created_at.desc`, { headers: headers() })) || [];
  updateCounts(all);
  render();
}

async function toggleTask(task) {
  try {
    await request(`${TABLE}?id=eq.${task.id}`, {
      method: 'PATCH',
      headers: headers({ Prefer: 'return=minimal' }),
      body: JSON.stringify({ completed: !task.completed }),
    });
    await loadTasks();
  } catch (err) { showTip(err.message); }
}

async function deleteTask(task) {
  try {
    await request(`${TABLE}?id=eq.${task.id}`, {
      method: 'DELETE',
      headers: headers({ Prefer: 'return=minimal' }),
    });
    await loadTasks();
  } catch (err) { showTip(err.message); }
}

/* ---------- 事件 ---------- */
el.form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = el.title.value.trim();
  if (!title) { showTip('任务标题不能为空'); return; }

  const btn = el.form.querySelector('.btn-primary');
  btn.disabled = true;
  showTip('');
  try {
    await request(TABLE, {
      method: 'POST',
      headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify({ title, priority: el.priority.value }),
    });
    el.title.value = '';
    el.title.focus();
    await loadTasks();
  } catch (err) {
    showTip(err.message);
  } finally {
    btn.disabled = false;
  }
});

el.filters.addEventListener('click', async (e) => {
  const btn = e.target.closest('.filter');
  if (!btn) return;
  const filter = btn.dataset.filter;
  if (filter === state.filter) return;
  state.filter = filter;
  el.filters.querySelectorAll('.filter').forEach((b) => b.classList.toggle('active', b === btn));
  try { await loadTasks(); } catch (err) { showTip(err.message); }
});

/* ---------- 启动 ---------- */
(async function init() {
  try { await loadTasks(); } catch (err) { showTip(`加载失败：${err.message}`); }
})();
</script>
</body>
</html>
